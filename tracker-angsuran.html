<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Angsuran – KOPENA Limpung</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f14;
  --s1: #131920;
  --s2: #1a2230;
  --s3: #243040;
  --border: #2a3a50;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.1);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.1);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245,158,11,0.1);
  --text: #e2eaf4;
  --text2: #7a99be;
  --text3: #445566;
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse 70% 30% at 10% 0%,rgba(34,197,94,0.05) 0%,transparent 60%),
  radial-gradient(ellipse 60% 25% at 90% 100%,rgba(59,130,246,0.05) 0%,transparent 60%);}

/* Header */
header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;background:rgba(11,15,20,0.95);backdrop-filter:blur(12px);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--green),#15803d);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand h1{font-size:15px;font-weight:800;line-height:1.2;}
.brand p{font-size:10px;color:var(--text2);}
.clock{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--green);
  background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);padding:5px 10px;border-radius:20px;}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--s1);overflow-x:auto;}
.tab{padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);
  border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;user-select:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--green);border-bottom-color:var(--green);}

/* Main layout */
main{max-width:1100px;margin:0 auto;padding:20px 14px 80px;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.stat-num{font-size:26px;font-weight:800;line-height:1;}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px;}
.stat.g .stat-num{color:var(--green);}
.stat.r .stat-num{color:var(--red);}
.stat.b .stat-num{color:var(--blue);}
.stat.y .stat-num{color:var(--yellow);}

/* Period selector */
.period-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.period-bar select,.period-bar input[type=text]{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:13px;padding:8px 12px;border-radius:var(--rs);outline:none;}
.period-bar select:focus,.period-bar input:focus{border-color:var(--blue);}
.pbtn{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--s2);color:var(--text2);
  transition:all .2s;font-family:inherit;white-space:nowrap;}
.pbtn.active{background:var(--green);color:#000;border-color:var(--green);}
.pbtn:hover:not(.active){background:var(--s3);color:var(--text);}
.spacer{flex:1;}

/* Progress bar */
.prog-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px;}
.prog-bar{height:10px;background:var(--s3);border-radius:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#16a34a);border-radius:5px;
  transition:width .5s ease;}

/* Table */
.tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.tbl-head{display:grid;grid-template-columns:36px 1fr 140px 110px 90px 100px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.tbl-body{max-height:calc(100vh - 380px);overflow-y:auto;}
.tbl-body::-webkit-scrollbar{width:4px;}
.tbl-body::-webkit-scrollbar-track{background:var(--s1);}
.tbl-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.row{display:grid;grid-template-columns:36px 1fr 140px 110px 90px 100px;
  padding:9px 14px;border-bottom:1px solid rgba(42,58,80,0.5);
  align-items:center;transition:background .15s;cursor:default;}
.row:hover{background:rgba(255,255,255,0.03);}
.row.lunas{background:rgba(34,197,94,0.06);}
.row.lunas .nama-cell{color:var(--green);font-weight:600;}

.no-cell{font-size:11px;color:var(--text3);font-family:"JetBrains Mono",monospace;}
.nama-cell{font-size:13px;font-weight:600;color:var(--text);}
.norek-cell{font-size:10px;color:var(--text3);font-family:"JetBrains Mono",monospace;margin-top:2px;}
.jt-cell{font-size:11px;color:var(--text2);}
.jt-cell.past{color:var(--red);}
.out-cell{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--text2);}
.status-cell{display:flex;align-items:center;}

/* Toggle button */
.toggle-btn{
  padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;
  cursor:pointer;border:1px solid;transition:all .2s;font-family:inherit;
  white-space:nowrap;
}
.toggle-btn.belum{background:var(--red-dim);color:var(--red);border-color:rgba(239,68,68,0.3);}
.toggle-btn.belum:hover{background:rgba(239,68,68,0.2);}
.toggle-btn.lunas{background:var(--green-dim);color:var(--green);border-color:rgba(34,197,94,0.3);}
.toggle-btn.lunas:hover{background:rgba(34,197,94,0.2);}

/* Empty */
.empty{text-align:center;padding:40px;color:var(--text3);}

/* Week grid */
.week-section{margin-bottom:16px;}
.week-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--text3);padding:8px 14px;background:var(--s2);border:1px solid var(--border);
  border-bottom:none;border-radius:var(--r) var(--r) 0 0;
  display:flex;align-items:center;justify-content:space-between;}
.week-title .wstat{font-size:10px;color:var(--text2);}

/* Summary cards per bulan */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:20px;}
.month-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px;}
.month-card h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text);}
.month-mini-bar{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.month-mini-fill{height:100%;background:var(--green);border-radius:3px;}
.month-stats{display:flex;gap:12px;font-size:11px;}
.month-stats span{color:var(--text2);}
.month-stats .gn{color:var(--green);}
.month-stats .rd{color:var(--red);}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:9px 18px;
  font-size:13px;color:var(--text);transition:transform .3s;z-index:500;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Search */
.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px;}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;}
.search-wrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;}

@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr;}
  .tbl-head,.row{grid-template-columns:30px 1fr 80px 80px;}
  .out-cell,.jt-cell{display:none;}
}
</style>
</head>

// ─── State ──────────────────────────────────────────────────
// lunasMap: { "YYYY-MM": Set<norek> }
function getLunasMap() {
  try { return JSON.parse(localStorage.getItem('kopena-lunas') || '{}'); } catch(e){ return {}; }
}
function saveLunasMap(m) {
  const s = {};
  for (const k in m) s[k] = Array.from(m[k]);
  localStorage.setItem('kopena-lunas', JSON.stringify(s));
}
function loadLunasMap() {
  const raw = getLunasMap();
  const m = {};
  for (const k in raw) m[k] = new Set(raw[k]);
  return m;
}
let lunasMap = loadLunasMap();

let activeTab = 'bulanan';
let filterMode = { bulanan: 'semua', semua: 'semua' };

// ─── Helpers ─────────────────────────────────────────────────
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni',
                   'Juli','Agustus','September','Oktober','November','Desember'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function periodKey(y, m) { return y + '-' + String(m).padStart(2,'0'); }
function isLunas(norek, y, m) {
  const k = periodKey(y, m);
  return lunasMap[k] && lunasMap[k].has(norek);
}
function toggleLunas(norek, y, m) {
  const k = periodKey(y, m);
  if (!lunasMap[k]) lunasMap[k] = new Set();
  if (lunasMap[k].has(norek)) { lunasMap[k].delete(norek); return false; }
  else { lunasMap[k].add(norek); return true; }
}

function fmtRp(n) {
  if (!n || isNaN(n)) return '-';
  return 'Rp ' + Number(n).toLocaleString('id-ID');
}

function parseDate(s) {
  if (!s || s === '' || s === 'nan') return null;
  const [d,m,y] = s.split('-');
  if (!d||!m||!y) return null;
  return new Date(+y, +m-1, +d);
}

function getWeekOfMonth(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), 1);
  const first = d.getDay(); // 0=sun
  return Math.ceil((date.getDate() + first) / 7);
}

function getDayInPeriod(norekOrRecord, y, m) {
  // Extract day from jatuh tempo for the given month
  const r = typeof norekOrRecord === 'object' ? norekOrRecord : RAW.find(x => x.norek === norekOrRecord);
  if (!r) return null;
  const dt = parseDate(r.jatuhTempo);
  if (!dt) return null;
  return dt.getDate();
}

// Get members whose jatuh tempo falls in a given month
// But for tracker: ALL active members are tracked each month (angsuran bulanan)
// We treat jatuh tempo as the day of month for payment
// If jatuh tempo year < current: still active (overdue)

function isDateValid(s) {
  return s && s.length >= 8 && /\d{2}-\d{2}-\d{4}/.test(s);
}

// ─── Clock ──────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('id-ID');
}
setInterval(tick, 1000); tick();

// ─── Selectors init ─────────────────────────────────────────
function initSelectors() {
  const now = new Date();
  const curM = now.getMonth() + 1;
  const curY = now.getFullYear();
  const years = [curY - 1, curY, curY + 1];

  ['sel-month','sel-week-month'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = MONTHS_ID.map((n,i) =>
      `<option value="${i+1}" ${i+1===curM?'selected':''}>${n}</option>`).join('');
  });
  ['sel-year','sel-week-year'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = years.map(y =>
      `<option value="${y}" ${y===curY?'selected':''}>${y}</option>`).join('');
  });
}

// ─── Tab ────────────────────────────────────────────────────
function setTab(t, el) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  ['bulanan','mingguan','semua'].forEach(v =>
    document.getElementById('view-' + v).style.display = v === t ? '' : 'none');
  if (t === 'bulanan') renderBulanan();
  if (t === 'mingguan') renderMingguan();
  if (t === 'semua') renderSemua();
}

function filterLunas(mode, btn) {
  filterMode.bulanan = mode;
  btn.closest('.period-bar').querySelectorAll('.pbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBulanan();
}

function filterAll(mode, btn) {
  filterMode.semua = mode;
  btn.closest('.period-bar').querySelectorAll('.pbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSemua();
}

// ─── Build Row ───────────────────────────────────────────────
function buildRow(r, y, m) {
  const lunas = isLunas(r.norek, y, m);
  const dt = parseDate(r.jatuhTempo);
  const today = new Date();
  const isPast = dt && dt < today;
  const jtText = isDateValid(r.jatuhTempo) ? r.jatuhTempo : '—';

  return `<div class="row ${lunas ? 'lunas' : ''}" id="row-${r.norek}-${y}-${m}">
    <div class="no-cell">${r.no}</div>
    <div>
      <div class="nama-cell">${r.nama}</div>
      <div class="norek-cell">${r.norek}</div>
    </div>
    <div class="jt-cell ${isPast && !lunas ? 'past' : ''}">${jtText}</div>
    <div class="out-cell">${fmtRp(r.outstanding)}</div>
    <div class="status-cell">
      <span style="font-size:12px;color:${lunas ? 'var(--green)' : 'var(--red)'}">
        ${lunas ? '✅' : '❌'}
      </span>
    </div>
    <div>
      <button class="toggle-btn ${lunas ? 'lunas' : 'belum'}"
        onclick="doToggle('${r.norek}',${y},${m})">
        ${lunas ? '✅ Lunas' : 'Belum'}
      </button>
    </div>
  </div>`;
}

function doToggle(norek, y, m) {
  const became = toggleLunas(norek, y, m);
  saveLunasMap(lunasMap);
  // Patch the row in-place
  const rowEl = document.getElementById('row-' + norek + '-' + y + '-' + m);
  if (rowEl) {
    const r = RAW.find(x => x.norek === norek);
    rowEl.outerHTML = buildRow(r, y, m);
  }
  if (activeTab === 'bulanan') updateBulananStats(y, m);
  if (activeTab === 'mingguan') updateWeekStats(y, m);
  const nama = RAW.find(x => x.norek === norek)?.nama || norek;
  toast(became ? `✅ ${nama} — Lunas` : `❌ ${nama} — Dibatalkan`);
}

// ─── Bulanan ─────────────────────────────────────────────────
function renderBulanan() {
  const m = +document.getElementById('sel-month').value;
  const y = +document.getElementById('sel-year').value;
  const q = document.getElementById('search-b').value.toLowerCase();
  const fm = filterMode.bulanan;

  let list = RAW.filter(r => {
    if (q && !r.nama.toLowerCase().includes(q) && !r.norek.includes(q)) return false;
    if (fm === 'lunas' && !isLunas(r.norek, y, m)) return false;
    if (fm === 'belum' && isLunas(r.norek, y, m)) return false;
    return true;
  });

  document.getElementById('tbl-body-b').innerHTML = list.length
    ? list.map(r => buildRow(r, y, m)).join('')
    : '<div class="empty">Tidak ada data.</div>';

  updateBulananStats(y, m);
}

function updateBulananStats(y, m) {
  const total = RAW.length;
  const lunas = RAW.filter(r => isLunas(r.norek, y, m)).length;
  const belum = total - lunas;
  const pct = Math.round(lunas / total * 100);

  document.getElementById('month-stats-bar').innerHTML = `
    <div class="stat b"><div class="stat-num">${total}</div><div class="stat-lbl">Total Anggota</div></div>
    <div class="stat g"><div class="stat-num">${lunas}</div><div class="stat-lbl">Sudah Bayar</div></div>
    <div class="stat r"><div class="stat-num">${belum}</div><div class="stat-lbl">Belum Bayar</div></div>
    <div class="stat y"><div class="stat-num">${pct}%</div><div class="stat-lbl">Progress Koleksi</div></div>`;

  document.getElementById('prog-text').textContent =
    `${MONTHS_ID[m-1]} ${y} — ${lunas} dari ${total} anggota sudah membayar`;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ─── Mingguan ────────────────────────────────────────────────
function renderMingguan() {
  const m = +document.getElementById('sel-week-month').value;
  const y = +document.getElementById('sel-week-year').value;
  const q = document.getElementById('search-w').value.toLowerCase();

  // Group members by week based on jatuh tempo day
  const weeks = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  RAW.forEach(r => {
    if (q && !r.nama.toLowerCase().includes(q) && !r.norek.includes(q)) return;
    const dt = parseDate(r.jatuhTempo);
    let week = 5; // default last
    if (dt) {
      const day = dt.getDate();
      week = day <= 7 ? 1 : day <= 14 ? 2 : day <= 21 ? 3 : day <= 28 ? 4 : 5;
    }
    weeks[week].push(r);
  });

  const weekLabels = {
    1: 'Minggu 1 (Tgl 1–7)',
    2: 'Minggu 2 (Tgl 8–14)',
    3: 'Minggu 3 (Tgl 15–21)',
    4: 'Minggu 4 (Tgl 22–28)',
    5: 'Minggu 5+ (Tgl 29+)'
  };

  let html = '';
  let totalLunas = 0, totalBelum = 0;
  for (let w = 1; w <= 5; w++) {
    const list = weeks[w];
    if (!list.length) continue;
    const lCnt = list.filter(r => isLunas(r.norek, y, m)).length;
    const bCnt = list.length - lCnt;
    totalLunas += lCnt; totalBelum += bCnt;
    html += `<div class="week-section">
      <div class="week-title">
        <span>📅 ${weekLabels[w]}</span>
        <span class="wstat">
          <span style="color:var(--green)">✅ ${lCnt}</span> &nbsp;
          <span style="color:var(--red)">❌ ${bCnt}</span>
        </span>
      </div>
      <div class="tbl-wrap" style="border-radius:0 0 var(--r) var(--r)">
        <div class="tbl-head">
          <div>No</div><div>Nama Anggota</div><div>Jatuh Tempo</div><div>Outstanding</div><div>Status</div><div>Aksi</div>
        </div>
        <div>${list.map(r => buildRow(r, y, m)).join('')}</div>
      </div>
    </div>`;
  }
  document.getElementById('week-sections').innerHTML = html || '<div class="empty">Tidak ada data.</div>';
  updateWeekStats(y, m);
}

function updateWeekStats(y, m) {
  const total = RAW.length;
  const lunas = RAW.filter(r => isLunas(r.norek, y, m)).length;
  document.getElementById('week-stats-bar').innerHTML = `
    <div class="stat b"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat g"><div class="stat-num">${lunas}</div><div class="stat-lbl">Sudah Bayar</div></div>
    <div class="stat r"><div class="stat-num">${total - lunas}</div><div class="stat-lbl">Belum Bayar</div></div>
    <div class="stat y"><div class="stat-num">${Math.round(lunas/total*100)}%</div><div class="stat-lbl">Progress</div></div>`;
}

// ─── Semua ───────────────────────────────────────────────────
function renderSemua() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const q = document.getElementById('search-all').value.toLowerCase();
  const fm = filterMode.semua;

  let list = RAW.filter(r => {
    if (q && !r.nama.toLowerCase().includes(q) && !r.norek.includes(q)) return false;
    if (fm === 'lunas' && !isLunas(r.norek, y, m)) return false;
    if (fm === 'belum' && isLunas(r.norek, y, m)) return false;
    return true;
  });

  document.getElementById('tbl-body-all').innerHTML = list.length
    ? list.map(r => buildRow(r, y, m)).join('')
    : '<div class="empty">Tidak ada data.</div>';
}

// ─── Toast ───────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Init ────────────────────────────────────────────────────
initSelectors();
renderBulanan();
</script>
</body>
</html>
