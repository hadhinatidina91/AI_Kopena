<style>
:root{--brand:#0f4d43;--brand2:#1a6b5e;--soft:#e4ede9;--bg:#eef3f1;--surface:#fff;--line:#dbe5e1;--ink:#12201a;--muted:#69796f;--amber:#b5842a;--amber-soft:#fbf3e2;--red:#c0392b;--red-soft:#fbeae7;--green:#1f7a45;--green-soft:#e6f4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;font-size:15px;line-height:1.5;overscroll-behavior:none}
.nums{font-variant-numeric:tabular-nums}
.head{background:var(--brand);color:#f2f7f4;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(135deg,#1a6b5e,#0b3a33);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#c8f0e2;border:1px solid rgba(255,255,255,.18)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:800}
.brand p{margin:1px 0 0;font-size:11px;color:#a9cfc4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#eaf6f1;width:36px;height:36px;flex:0 0 36px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.25)}
.chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:100%;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{padding:10px 13px;border-radius:16px;max-width:88%;font-size:14.5px;word-break:break-word;overflow-wrap:anywhere}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(16,40,34,.04)}
.msg.user .bubble{background:var(--brand);color:#f0f8f5;border-bottom-right-radius:5px}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:2px}
.msg.user .avatar{display:none}
.bubble h3{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--brand)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0;padding-left:18px}.bubble li{margin-bottom:4px}
.bubble code{background:#eef3f1;padding:1px 5px;border-radius:5px;font-size:12.5px}
.bubble pre{background:#f3f6f5;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.bubble .dim{color:var(--muted);font-size:12.5px}
.bubble hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:8px 0;background:#fbfdfc;cursor:pointer}
.card:active{background:var(--soft)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-weight:700;font-size:14px}
.card .rek{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.card .line{font-size:12.5px;color:var(--muted);margin-top:3px}
.card .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--brand);white-space:nowrap}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.grey{background:#eef1ef;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
.tl{border-left:2px solid var(--soft);margin:8px 0 8px 5px;padding-left:12px}
.tl-item{position:relative;padding-bottom:11px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tl-date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tl-text{font-size:13.5px;margin-top:1px;white-space:pre-wrap}
.tl-meta{font-size:11px;color:var(--muted);margin-top:3px}
.tl-meta a{color:var(--brand2);text-decoration:none;font-weight:600}
.foto-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:#eef3f1}
.foto-thumb.big{width:88px;height:88px}
.photo-block{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.photo-block .pb-head{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.note{padding:10px 12px;border-radius:10px;margin:8px 0}
.note.ok{background:#e6f4ea;border:1px solid #c6e6d1;color:#1c6b3d}
.note.bad{background:#fbeae7;border:1px solid #f2c8c1;color:#9c3225}
.note.warn{background:#fbf3e2;border:1px solid #f0d888;color:#7a5c00}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b9c9c3;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--brand);cursor:pointer;white-space:nowrap}
.chip:active{background:var(--soft)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);position:sticky;bottom:0}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:#f7faf9;font:inherit;font-size:15px;color:var(--ink);outline:none}
.composer input:focus{border-color:var(--brand2);background:#fff}
.composer button{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
#btnMic{background:var(--soft);color:var(--brand)}
#btnMic.rec{background:#ffdad4;color:#c0392b;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.55}}
#btnSend{background:var(--brand);color:#fff}
#btnSend:disabled{opacity:.4}
.lightbox{position:fixed;inset:0;background:rgba(8,18,15,.94);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;flex-direction:column;gap:12px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:80vh;border-radius:10px}
.lightbox .lb-close{position:absolute;top:20px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.lightbox .lb-info{color:#a9cfc4;font-size:12.5px;text-align:center}
</style>
</head>
<body>

<header class="head">
  <div class="logo">TK</div>
  <div class="brand">
    <h1>Tanya KOPENA</h1>
    <p id="srcStatus">Menyambungkan…</p>
  </div>
  <button class="icon-btn" id="btnKey" title="Kunci AI (admin: set sekali untuk semua)">🔑</button>
  <button class="icon-btn" id="btnClearChat" title="Obrolan baru">🗑</button>

<main class="chat" id="chat"></main>

<form class="composer" id="composer">

  <input id="q" placeholder="Tanya apa saja tentang nasabah…" autocomplete="off" enterkeyhint="send">
  <button type="submit" id="btnSend">➤</button>
</form>

<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()"></div>

<script>
/* ============================================================
   TANYA KOPENA v1.1 — CHAT ASISTEN (perbaikan jawaban)
   Sumber:
   1. Master nasabah: SHEET_API_URL (sama dengan TungCab)
   2. Kunjungan & foto: Firebase catatanpembiayaan (Buku Kunjungan)
   3. Laporan marketing: Firebase pembiayaankpnlimpung (LimpungPBY)
   Perbaikan v1.1:
   - Nama kolom master dinormalisasi (tidak peduli huruf besar/kecil, spasi, underscore)
   - Status LUNAS dipisah dari nasabah aktif
   - "sudah angsur" tidak lagi hanya cek === true (bisa "Ya", 1, "SUDAH", dst)
   - Pertanyaan umum tidak lagi salah dikira nama orang
   - "Belum dikunjungi" hanya menghitung yang benar-benar punya catatan kunjungan
   - Perintah "diagnosa" untuk melihat data mentah dari server
   ============================================================ */

/* ============ KONFIG ============ */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzUTxsPIJR3Dp-GBQkQ1S2Afl7X3arqSAlUe_AZ3m7KDTnGNTmPgUsgABNa5vobH9mO/exec";
const SHEET_KEY = "12cc24460413dcf085c944540610c472df8d3c4441fca84d";

const CFG_BK = {apiKey:"AIzaSyBHFSeVEeuVr92MT2moc0FObzPxCGRiCoo",authDomain:"catatanpembiayaan.firebaseapp.com",databaseURL:"https://catatanpembiayaan-125fd-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"catatanpembiayaan",storageBucket:"catatanpembiayaan.firebasestorage.app",messagingSenderId:"840093282726",appId:"1:840093282726:web:307e1d9d5296cb2925df67"};
const CFG_MK = {apiKey:"AIzaSyAF6SwxLv6e1BpvOm_n1lMB1GnN5ZjSVnM",authDomain:"pembiayaankpnlimpung.firebaseapp.com",databaseURL:"https://pembiayaankpnlimpung-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pembiayaankpnlimpung",storageBucket:"pembiayaankpnlimpung.firebasestorage.app",messagingSenderId:"162750710548",appId:"1:162750710548:web:feee95cb39b9e7456ff801"};
const BK_ROOT = "buku-kunjungan-nasabah";
const INDEX_KEY = "nasabah-index-v2";
const DETAIL_KEY = "nasabah-detail-v2";

/* ============ UTIL ============ */
const $ = (s,r)=>(r||document).querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v===''||v==null)return 0;if(typeof v==='number')return isFinite(v)?v:0;let s=String(v).trim();if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else s=s.replace(/,/g,'.');const n=Number(s.replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function normNama(s){let t=String(s||'').toUpperCase();t=t.replace(/\b(H|HJ|HAJI|HAJAH|MUH|MOH|MOHAMMAD|MUHAMMAD|ABD|ABDUL|PAK|BU|BAPAK|IBU|SDR|SDRI)\b\.?\s+/g,' ');t=t.replace(/[^A-Z0-9 ]/g,' ');return t.replace(/\s+/g,' ').trim()}
function lev(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);return m[b.length][a.length]}
function fmtRp(v){const n=Math.round(num(v));if(Math.abs(n)>=1e9)return'Rp '+(n/1e9).toFixed(2)+' M';if(Math.abs(n)>=1e6)return'Rp '+(n/1e6).toFixed(2)+' jt';return'Rp '+n.toLocaleString('id-ID')}
function fmtRpFull(v){return'Rp '+Math.round(num(v)).toLocaleString('id-ID')}
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(iso){if(!iso)return'-';const s=String(iso).slice(0,10);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m){const m2=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);if(m2)return m2[1]+' '+BLN[parseInt(m2[2],10)-1]+' '+m2[3];return s}return parseInt(m[3],10)+' '+BLN[parseInt(m[2],10)-1]+' '+m[1]}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toArray(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);if(typeof v==='object')return Object.keys(v).sort((a,b)=>{const na=parseInt(a,10),nb=parseInt(b,10);if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a).localeCompare(String(b))}).map(k=>v[k]).filter(Boolean);return[]}
function extractFotos(v){if(!v)return[];const c=[v.photos,v.fotos,v.foto,v.photo,v.images,v.gambar];for(const x of c){const arr=toArray(x);const s=arr.map(y=>{if(typeof y==='string')return y;if(y&&typeof y==='object')return y.url||y.src||y.data||y.base64||'';return''}).filter(y=>typeof y==='string'&&y.length>20);if(s.length)return s}if(typeof v.photos==='string'&&v.photos.length>20)return[v.photos];if(typeof v.foto==='string'&&v.foto.length>20)return[v.foto];return[]}
function waLink(no,nama){if(!no)return null;let d=String(no).replace(/\D/g,'');if(!d)return null;if(d.startsWith('0'))d='62'+d.slice(1);else if(!d.startsWith('62'))d='62'+d;const t=nama?'Halo '+nama+', ':'';return'https://wa.me/'+d+'?text='+encodeURIComponent(t)}
function mapsUrl(a){if(!a)return null;let s=String(a).trim().replace(/\bDK\.?\s*/gi,'Dukuh ').replace(/\bDS\.?\s*/gi,'Desa ').replace(/\bKEC\.?\s*/gi,'Kecamatan ').replace(/\bRT\s*\/?\s*RW\.?\s*\d+\s*\/\s*\d*/gi,' ').replace(/\s+/g,' ').trim();if(!/batang/i.test(s))s+=', Batang, Jawa Tengah';return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s)}
function mapsCoord(lat,lng){return'https://www.google.com/maps/search/?api=1&query='+lat+','+lng}
function note(t,c){return'<div class="note '+c+'">'+t+'</div>'}

/* ============ STATE ============ */
const DB = {master:[], rawRows:[], bk:[], bkDetail:{}, mk:[], masterErr:'', paidRek:new Set(), paidNama:new Set(), ready:{master:false,bk:false,mk:false}};

/* ============ NORMALISASI MASTER ============ */
function keyOf(k){return String(k).toLowerCase().replace(/[^a-z0-9]/g,'')}
function toBool(v){
  if(v===undefined||v===null)return null;
  if(typeof v==='boolean')return v;
  if(typeof v==='number')return v!==0;
  const s=String(v).trim().toLowerCase();
  if(!s)return null;
  if(/^(true|ya|y|yes|sudah|1|lunas|ok)$/.test(s))return true;
  return false;
}
function normRow(raw){
  const km={};
  Object.keys(raw||{}).forEach(k=>{km[keyOf(k)]=raw[k]});
  const g=(...ns)=>{for(const n of ns){if(km[n]!==undefined&&km[n]!==null&&km[n]!=='')return km[n]}return undefined};
  const keys=Object.keys(km);
  const collKey=keys.find(k=>k==='coll'||k==='call'||k==='kol')||keys.find(k=>/^(coll|call|kol)/.test(k));
  let coll=null;
  if(collKey!==undefined&&km[collKey]!==''&&km[collKey]!=null){const c=parseInt(String(km[collKey]).replace(/[^0-9]/g,''),10);if(!isNaN(c))coll=c}
  const status=String(g('status','statusprogres','statusrekening')||'').trim().toUpperCase();
  const lunasFlag=toBool(g('lunas','islunas'));
  const r={
    _raw:raw,
    nama:String(g('nama','namaanggota','namanasabah','namadebitur','debitur')||'').trim(),
    no_rekening:String(g('norekening','norek','nomorrekening','rekening','norekpembiayaan','rekpembiayaan','norekeningpembiayaan')||'').trim(),
    ao:String(g('ao','namaao','accountofficer')||'').trim(),
    coll:coll,
    saldo:num(g('saldopokoknet','sisapokokakhir','sisapokok','saldo','outstanding','os','baki','bakidebet','sisapinjaman')),
    saldo_total:num(g('saldototalnet','sisatotalakhir')),
    saldo_raw:num(g('saldo')),
    _adaNet:(km.saldopokoknet!==undefined&&km.saldototalnet!==undefined),
    plafon:num(g('plafon','plafond')),
    angsuran_bulanan:num(g('angsuranbulanan','angsuranperbulan','angsuran')),
    pembayaran_pokok:num(g('pembayaranpokok','bayarpokok','pokok')),
    pembayaran_margin:num(g('pembayaranmargin','bayarmargin','margin')),
    tgl_jatuh_tempo:g('tgljatuhtempo','jatuhtempo','tanggaljatuhtempo')||'',
    alamat:String(g('alamat')||'').trim(),
    no_hp:String(g('nohp','hp','nowa','nowhatsapp','telepon','telp')||'').trim(),
    produk:String(g('produk','jenisproduk','jenispembiayaan')||'').trim(),
    status:status,
    lunas:false,
    sudah_angsur:toBool(g('sudahangsur','sudahangsuran','sudahbayar','statusangsur','statusangsuran'))
  };
  /* Server TungCab tidak punya kolom status/lunas. Lunas = ditandai eksplisit, atau saldo pokok & total sama-sama nol */
  r.saldo_nol=r._adaNet&&r.saldo<=0&&r.saldo_total<=0;
  r.lunas=(status==='LUNAS')||lunasFlag===true||r.saldo_nol;
  return r;
}
function produkDist(list){const d={};list.forEach(m=>{const k=m.produk||'(tanpa produk)';d[k]=(d[k]||0)+1});return d}
function nasabahUnik(list){return new Set(list.map(m=>normNama(m.nama)).filter(Boolean)).size}
function aktifList(){return DB.master.filter(m=>!m.lunas)}
function lunasList(){return DB.master.filter(m=>m.lunas)}
function buildPaidSets(){
  const ym=todayISO().slice(0,7);
  DB.paidRek=new Set();DB.paidNama=new Set();
  DB.mk.forEach(r=>{
    if(r.status!=='Sudah Bayar')return;
    if(String(r.tanggal||'').slice(0,7)!==ym)return;
    if(r.norek)DB.paidRek.add(String(r.norek).trim());
    if(r.debitur)DB.paidNama.add(normNama(r.debitur));
  });
}
function serverHasAngsurFlag(){return DB.master.some(m=>m.sudah_angsur!==null)}
function sudahAngsur(m){
  if(m.sudah_angsur!==null)return m.sudah_angsur;
  if(num(m.pembayaran_pokok)+num(m.pembayaran_margin)>0)return true;
  if(m.no_rekening&&DB.paidRek.has(m.no_rekening))return true;
  return DB.paidNama.has(normNama(m.nama));

/* ============ MATCHING ============ */
function scoreName(q,target){
  if(!q||!target)return 0;
  const a=norm(q),b=norm(target);
  if(!a||!b)return 0;
  if(b===a)return 100;
  if(b.startsWith(a))return 88;
  if(b.includes(a))return 74;
  const qt=a.split(' ').filter(w=>w.length>1);
  if(!qt.length)return 0;
  const bt=b.split(' ');
  let hit=0;
  qt.forEach(w=>{
    if(bt.some(t=>t===w))hit+=1;
    else if(bt.some(t=>t.startsWith(w)&&w.length>=3))hit+=0.75;
    else if(w.length>=4&&bt.some(t=>t.includes(w)))hit+=0.5;
  });
  const d=lev(a,b);
  if(d<=2&&Math.min(a.length,b.length)>=4)return 65+(2-d)*10;
  if(!hit)return 0;
  return 30+(hit/qt.length)*45;
}

function findMasterRecords(query,limit){
  const q=String(query||'').trim();
  if(!q)return[];
  const scored=[];
  DB.master.forEach(m=>{
    let s=scoreName(q,m.nama);
    const sRek=scoreName(q,m.no_rekening)*0.6;
    if(sRek>s)s=sRek;
    const sAl=scoreName(q,m.alamat)*0.4;
    if(sAl>s)s=sAl;
    if(s>=40)scored.push({m,s});
  });
  scored.sort((a,b)=>b.s-a.s);
  return scored.slice(0,limit||8).map(x=>x.m);
}
function findMasterByRek(rek){const r=String(rek||'').trim();if(!r)return null;return DB.master.find(m=>m.no_rekening===r)||null}
function findMasterByName(nama){
  if(!nama)return null;
  const key=normNama(nama);
  if(!key)return null;
  let hit=DB.master.find(m=>normNama(m.nama)===key);
  if(hit)return hit;
  let best=null,bestS=0;
  DB.master.forEach(m=>{
    const s=scoreName(nama,m.nama);
    if(s>bestS&&s>=55){bestS=s;best=m}
  });
  return best;
}
/* Cari 1 nasabah dari teks nama — null kalau tidak yakin */
function resolveOne(nama){
  if(!nama||nama.length<3)return null;
  return findMasterByName(nama)||findMasterRecords(nama,1)[0]||null;
}

/* Kunjungan + laporan untuk 1 nasabah */
function getFirebaseTimeline(masterRec){
  if(!masterRec)return[];
  const nameKey=normNama(masterRec.nama);
  const rekKey=String(masterRec.no_rekening||'').trim();
  const out=[];
  DB.bk.forEach(n=>{
    const rekP=String(n.rekPembiayaan||'').trim();
    const rekS=String(n.rekSimpanan||'').trim();
    const sameRek=(rekKey&&(rekP===rekKey||rekS===rekKey));
    const sameName=(nameKey&&normNama(n.nama)===nameKey);
    if(!sameRek&&!sameName)return;
    const det=DB.bkDetail[n.id];
    if(det){
      toArray(det.kunjungan).forEach(v=>{
        if(v&&!v.deletedAt){
          out.push({sumber:'buku',tanggal:v.tanggal||'',hasil:v.hasil||'',lokasi:v.location||null,fotos:extractFotos(v),ao:n.ao||'',status:''});
        }
      });
    }
  });
  DB.mk.forEach(r=>{
    const sameRek=(rekKey&&String(r.norek||'').trim()===rekKey);
    const sameName=(nameKey&&normNama(r.debitur||'')===nameKey);
    if(!sameRek&&!sameName)return;
    out.push({sumber:'marketing',tanggal:r.tanggal||'',hasil:r.hasil||'',status:r.status||'',target:r.target||'',ao:r.ao||'',lokasi:r.lokasi||null,fotos:extractFotos(r),createdAt:r.createdAt||0});
  });
  out.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  return out;
}

function extractName(text){

/* ============ MAKSUD PERTANYAAN ============ */
function detectIntent(t){
  const s=' '+String(t).toLowerCase().replace(/[^\w\s\/:\-]/g,' ').replace(/\s+/g,' ')+' ';
  const clean=String(t).toLowerCase().trim().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
  const has=(...ws)=>ws.some(w=>s.includes(w));

  if(/^(diagnosa|debug|cek data|cek field|cek kolom)/.test(clean))return'diagnosa';
  if(/^(halo+|hai+|hi+|hello+|hey+|hallo+|helo+)(\s+(semua|kamu|bot|admin|min))?$/i.test(clean))return'sapaan';
  if(/^(assalamualaikum|assalamu\s*alaikum|salam)/i.test(clean))return'sapaan';
  if(/^selamat\s+(pagi|siang|sore|malam)$/i.test(clean))return'sapaan';
  if(/^(pagi|siang|sore|malam|permisi|test|tes|min|admin|bot)$/i.test(clean))return'sapaan';
  if(/^(terima\s*kasih|makasih|mksh|thanks|thx|tq|syukron|alhamdulillah|oke|ok|sip|baik|mantap|keren|siap)$/i.test(clean))return'sapaan';
  if(/^(kamu|km|kamu\s+siapa|siapa\s+kamu)$/i.test(clean))return'sapaan';
  if(/^(bisa\s+apa\s+aja|bisa\s+apa|fitur|menu|tolong|bantu|help)$/i.test(clean))return'bantuan';

  if(/\blunas\b/.test(s)||has('saldo nol','sudah lunas'))return'lunas';
  if(/\b(coll|call|kol)\b/.test(s)||has('macet','bermasalah','coll gede','call tinggi'))return'coll';
  if(has('janji bayar','janji','berjanji','sanggup bayar'))return'janji';
  if(/belum\s+(pernah\s+)?(di)?kunjung/.test(s)||has('belum ada kunjungan','belum disentuh','belum dicek'))return'belum';
  if(has('foto','photo','gambar','dokumentasi'))return'foto';
  if(has('riwayat','histori','kapan dikunjungi','hasil kunjungan','catatan'))return'riwayat';
  if(has('laporan marketing','laporan harian','cek laporan','marketing tanggal','laporan tanggal','laporan lapangan','ngapain di lapangan','kegiatan ao')||(/\blaporan\b/.test(s)&&has('marketing','harian','tanggal','lapangan')))return'laporan';
  if(/angsur|setor|nyetor|\bbayar\b|nunggak/.test(s))return'angsuran';
  if(/(total|jumlah|berapa).*(nasabah|rekening|anggota)/.test(s))return'total';
  if(has('rangkum','statistik','ringkasan'))return'statistik';
  if(has('tunggakan','outstanding','terbesar','piutang','os terbesar'))return'tunggakan';
  if(/\bao\b/.test(s)||has('rekap per ao','per ao'))return'ao';
  if(has('kunjungan'))return'riwayat';
  return'cari';
}

  const {d,none}=collDistOf(akt);
  let h='<h3>Rangkuman data 📊</h3><hr><dl class="kv">';
  h+='<dt>Rekening aktif</dt><dd class="nums">'+akt.length+'</dd>';
  h+='<dt>Lunas</dt><dd class="nums">'+lun.length+'</dd>';
  h+='<dt>Sudah angsur</dt><dd class="nums">'+sudah+'</dd>';
  h+='<dt>Belum angsur</dt><dd class="nums">'+(akt.length-sudah)+'</dd>';
  h+='<dt>Outstanding aktif</dt><dd class="nums">'+fmtRpFull(sumOS(akt))+'</dd>';

}

function answerAngsuran(t){
  const s=String(t).toLowerCase();
  const nama=extractName(t);
  if(nama.length>=3){
    const m=resolveOne(nama);
    if(m){
      const angsur=sudahAngsur(m);
      const bayar=getFirebaseTimeline(m).filter(v=>v.sumber==='marketing'&&v.status==='Sudah Bayar');
      let h='<h3>💵 Status angsuran — '+esc(m.nama)+'</h3>';
      h+='<div class="dim nums">'+esc(m.no_rekening)+' · AO: '+esc(m.ao||'-')+'</div><hr>';
      if(m.lunas)h+=note('<b>✓ LUNAS</b>','ok');
      else if(angsur)h+=note('<b>✓ SUDAH angsur</b>','ok');
      else h+=note('<b>⚠️ BELUM angsur</b>','bad');
      h+='<dl class="kv">';
      if(m.angsuran_bulanan)h+='<dt>Angsuran/bln</dt><dd class="nums">'+fmtRpFull(m.angsuran_bulanan)+'</dd>';
      if(m.pembayaran_pokok)h+='<dt>Bayar pokok</dt><dd class="nums">'+fmtRpFull(m.pembayaran_pokok)+'</dd>';
      if(m.pembayaran_margin)h+='<dt>Bayar margin</dt><dd class="nums">'+fmtRpFull(m.pembayaran_margin)+'</dd>';
      if(m.saldo)h+='<dt>Sisa OS</dt><dd class="nums">'+fmtRpFull(m.saldo)+'</dd>';
      h+='</dl>';
      if(bayar.length){
        h+='<hr><div class="dim"><b>Laporan setoran tercatat:</b></div><div class="tl">';
        bayar.slice(0,5).forEach(v=>{h+='<div class="tl-item"><div class="tl-date">'+esc(fmtTgl(v.tanggal))+'</div><div class="tl-text">'+esc(v.hasil||'-')+'</div></div>'});
        h+='</div>';
      }
      return h;
    }
  }
  const akt=aktifList();
  const sudah=akt.filter(sudahAngsur);
  const belum=akt.filter(m=>!sudahAngsur(m));
  const isBelum=/belum|tidak|gak|nggak|blm/.test(s);
  const list=(isBelum?belum:sudah).slice();
  const asked=/(berapa|jumlah|total)/.test(s);
  let h='<h3>'+(isBelum?'Belum angsur':'Sudah angsur')+': <b>'+list.length+'</b> dari '+akt.length+' rekening aktif</h3><hr>';
  h+='<dl class="kv"><dt>Sudah angsur</dt><dd class="nums" style="color:#1f7a45">'+sudah.length+'</dd><dt>Belum angsur</dt><dd class="nums" style="color:#c0392b">'+belum.length+'</dd><dt>Lunas (di luar hitungan)</dt><dd class="nums">'+lunasList().length+'</dd></dl>';
  h+='<div class="dim">'+esc(angsurSrcLabel())+'</div>';
  if(!asked||list.length<=20){
    list.sort((a,b)=>b.saldo-a.saldo);
    if(list.length){h+='<hr>';list.slice(0,20).forEach(m=>{h+=masterCard(m)})}
    if(list.length>20)h+='<div class="dim">Ditampilkan 20 terbesar dari '+list.length+'.</div>';
  }else{
    h+='<div class="dim" style="margin-top:6px">Ketik <code>'+(isBelum?'siapa yang belum angsur':'siapa yang sudah angsur')+'</code> untuk daftar namanya.</div>';
  }
  return h;
}

function answerLunas(t){
  const nama=extractName(t);
  const m=nama.length>=3?resolveOne(nama):null;
  if(m)return masterDetail(m);
  const lun=lunasList();
  let h='<h3>Rekening lunas (saldo nol): <b>'+lun.length+'</b></h3><hr>';
  h+='<div class="dim">Rekening aktif: '+aktifList().length+' · Total di data: '+DB.master.length+'</div>';
  h+='<div class="dim" style="margin-top:4px">Server TungCab tidak mengirim kolom status lunas. Di sini yang dihitung lunas hanya rekening yang saldo pokok dan saldo total-nya 0. Rekening yang hilang dari file CSV terbaru (ditandai LUNAS di menu Admin TungCab) tidak ikut terhitung karena tidak tersimpan di server.</div>';
  if(!lun.length){h+=note('Tidak ada rekening bersaldo nol di data server.','warn');return h}
  lun.slice(0,20).forEach(x=>{h+=masterCard(x)});
  if(lun.length>20)h+='<div class="dim">Ditampilkan 20 dulu dari '+lun.length+'.</div>';
  return h;
}

function answerColl(t){
  const s=String(t).toLowerCase();
  const akt=aktifList();
  let sel=null,label='';
  const mm=s.match(/\b(?:coll|call|kol)\s*([0-9])\b/);
  if(mm){sel=[parseInt(mm[1],10)];label='Coll '+mm[1]}
  else if(/tinggi|macet|bermasalah/.test(s)){sel=[3,4,5];label='Coll tinggi (≥3)'}
  const {d,none}=collDistOf(akt);
  let h;
  if(!sel){
    h='<h3>Sebaran Coll (rekening aktif)</h3><hr><dl class="kv">';
    Object.keys(d).sort((a,b)=>a-b).forEach(k=>{h+='<dt>Coll '+k+'</dt><dd class="nums"><b>'+d[k]+'</b></dd>'});
    if(none)h+='<dt>Tanpa Coll</dt><dd class="nums">'+none+'</dd>';
    h+='</dl><div class="dim">Total aktif: '+akt.length+'. Tanya <code>coll 3</code> untuk daftar namanya.</div>';
    if(!Object.keys(d).length)h+=note('Kolom Coll/Call tidak terbaca dari server. Ketik <b>diagnosa</b> untuk cek nama kolomnya.','warn');
    return h;
  }
  const list=akt.filter(x=>x.coll!=null&&sel.includes(x.coll)).sort((a,b)=>b.saldo-a.saldo);
  h='<h3>'+esc(label)+': <b>'+list.length+'</b> rekening</h3><hr>';
  if(!list.length){h+='<div class="dim">Tidak ada.</div>';return h}
  h+='<div class="dim">Outstanding: <b>'+fmtRpFull(sumOS(list))+'</b></div><hr>';
  list.slice(0,15).forEach(x=>{h+=masterCard(x)});
  if(list.length>15)h+='<div class="dim">Masih ada '+(list.length-15)+' lagi.</div>';
  return h;
}

function answerAO(t){
  const akt=aktifList();
  const aos=[...new Set(akt.map(m=>m.ao).filter(Boolean))];
  const hit=aos.filter(a=>{const w=norm(t);return w.includes(norm(a))||scoreName(extractName(t),a)>=74});
  const use=hit.length?hit:aos;
  let h='<h3>Rekap per AO</h3><hr>';
  if(!use.length)return h+note('Kolom AO tidak terbaca dari server. Ketik <b>diagnosa</b>.','warn');
  use.sort().forEach(a=>{
    const l=akt.filter(m=>m.ao===a),sd=l.filter(sudahAngsur).length;
    h+='<div class="card" style="cursor:default"><div class="top"><div class="name">'+esc(a)+'</div><div class="rek">'+l.length+' rek</div></div>'+
      '<div class="badges">'+badge('✓ '+sd+' sudah','green')+badge((l.length-sd)+' belum','grey')+badge('OS '+fmtRp(sumOS(l)),'amber')+'</div></div>';
  });
  return h;
}

      let h='<h3>📷 Foto Kunjungan — '+esc(m.nama)+'</h3>';

      h+='<div class="dim">'+tl.length+' kunjungan dengan foto.</div><hr>';
      tl.forEach(v=>{
        h+='<div class="photo-block"><div class="pb-head"><b>'+esc(fmtTgl(v.tanggal))+'</b>'+(v.ao?' · '+esc(v.ao):'')+(v.status?' · '+esc(v.status):'')+(v.hasil?'<br>'+esc(v.hasil.slice(0,120)):'')+'</div>'+renderFotoStrip(v.fotos,true)+'</div>';
      });
      return h;
    }
  }
  const all=[];
  DB.bk.forEach(n=>{
    const det=DB.bkDetail[n.id];
    if(det)toArray(det.kunjungan).forEach(v=>{

  all.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));

  if(!all.length)return h+'<hr><div class="dim">Belum ada foto.</div>';

}

function answerBelumDikunjungi(t){
  // Hanya yang BENAR-BENAR punya catatan kunjungan yang dihitung "sudah dikunjungi"
  const rekV=new Set(),namaV=new Set();
  DB.bk.forEach(n=>{
    const det=DB.bkDetail[n.id];
    const ada=det&&toArray(det.kunjungan).some(v=>v&&!v.deletedAt);
    if(!ada)return;
    if(n.rekPembiayaan)rekV.add(String(n.rekPembiayaan).trim());
    if(n.rekSimpanan)rekV.add(String(n.rekSimpanan).trim());
    if(n.nama)namaV.add(normNama(n.nama));
  });
  DB.mk.forEach(r=>{if(r.norek)rekV.add(String(r.norek).trim());if(r.debitur)namaV.add(normNama(r.debitur))});
  const akt=aktifList();
  const list=akt.filter(m=>!(m.no_rekening&&rekV.has(m.no_rekening))&&!namaV.has(normNama(m.nama)));
  let h='<h3>Belum pernah dikunjungi: <b>'+list.length+'</b> dari '+akt.length+' aktif</h3><hr>';
  if(!DB.ready.bk||!DB.ready.mk)h+=note('Data kunjungan/laporan belum selesai dimuat, hasil bisa belum lengkap.','warn');
  if(!list.length)return h+note('🎉 Semua nasabah aktif sudah pernah dicatat kunjungannya!','ok');
  list.sort((a,b)=>b.saldo-a.saldo);
  list.slice(0,15).forEach(m=>{h+=masterCard(m)});
  if(list.length>15)h+='<div class="dim">Masih ada '+(list.length-15)+' lagi (diurutkan OS terbesar).</div>';
  return h;
}

/* Parse tanggal dari teks Indonesia / ISO / dd-mm-yyyy */
function parseDateFromText(t){
  const s=String(t||'').toLowerCase();
  const blnMap={januari:1,jan:1,februari:2,feb:2,maret:3,mar:3,april:4,apr:4,mei:5,juni:6,jun:6,juli:7,jul:7,agustus:8,agu:8,september:9,sep:9,oktober:10,okt:10,november:11,nov:11,desember:12,des:12};
  // 2026-09-29 atau 29-09-2026 atau 29/09/2026
  let m=s.match(/\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\b/);
  if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  // 29 september 2026 / 29 sep 2026
  m=s.match(/\b(\d{1,2})\s+(januari|jan|februari|feb|maret|mar|april|apr|mei|juni|jun|juli|jul|agustus|agu|september|sep|oktober|okt|november|nov|desember|des)\s+(\d{4})\b/i);
  if(m){
    const bl=blnMap[m[2].toLowerCase()]||0;
    if(bl)return m[3]+'-'+String(bl).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  }
  // hanya "hari ini" / "kemarin"
  if(/\bhari\s*ini\b/.test(s))return todayISO();
  if(/\bkemarin\b/.test(s)){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  return null;
}

function answerLaporanMarketing(t){
  const tgl=parseDateFromText(t);
  const s=String(t||'').toLowerCase();
  // filter AO jika disebut (dari data laporan)
  const aosMk=[...new Set(DB.mk.map(r=>r.ao).filter(Boolean))];
  let aoFilter=null;
  for(const a of aosMk){
    const an=norm(a).toLowerCase();
    if(an && s.includes(an)){aoFilter=a;break}
    if(scoreName(extractName(t),a)>=70){aoFilter=a;break}
  }
  if(!aoFilter){
    const namaCoba=extractName(t);
    if(namaCoba.length>=3){
      for(const a of aosMk){
        if(scoreName(namaCoba,a)>=74){aoFilter=a;break}
      }
    }
  }

  let list=DB.mk.slice();
  if(tgl) list=list.filter(r=>String(r.tanggal||'').slice(0,10)===tgl);
  if(aoFilter) list=list.filter(r=>r.ao===aoFilter);

  list.sort((a,b)=>{
    const da=(b.tanggal||'')+'|'+(b.createdAt||0);
    const db=(a.tanggal||'')+'|'+(a.createdAt||0);
    return da.localeCompare(db);
  });

  const parts=[];
  if(tgl) parts.push(fmtTgl(tgl));
  if(aoFilter) parts.push('AO '+aoFilter);
  const label=parts.length?parts.join(' · '):'semua';

  let h='<h3>📋 Laporan Marketing Harian — '+esc(label)+'</h3>';
  if(!DB.ready.mk) h+=note('Data laporan marketing belum selesai dimuat. Tunggu sebentar atau tekan ⟳.','warn');
  h+='<div class="dim">Ditemukan <b>'+list.length+'</b> laporan'+(DB.mk.length?' · total database: '+DB.mk.length:'')+'.</div>';

  if(!list.length){
    h+='<hr>';
    if(tgl||aoFilter) h+=note('Tidak ada laporan untuk filter ini. Coba tanggal/AO lain, atau ketik <code>laporan marketing</code> untuk semua.','warn');
    else h+=note('Belum ada data laporan marketing.','warn');
    return h;
  }

  const st={};
  list.forEach(r=>{const k=r.status||'(tanpa status)';st[k]=(st[k]||0)+1});
  h+='<div class="dim" style="margin:6px 0 8px"><b>Status:</b> '+esc(Object.entries(st).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+' ('+e[1]+')').join(' · '))+'</div><hr>';

  // tampilan mirip LimpungPBY: Debitur + tanggal, hasil, status, AO, norek
  list.slice(0,30).forEach(r=>{
    const stColor=r.status==='Sudah Bayar'?'green':(r.status==='Janji Bayar'?'amber':(r.status==='Tidak Bertemu'?'red':'grey'));
    h+='<div class="card" data-rek="'+esc(r.norek||'')+'" data-nama="'+esc(r.debitur||'')+'">'+
      '<div class="top"><div class="name">'+esc(r.debitur||'(tanpa nama)')+'</div><div class="rek nums">'+esc(fmtTgl(r.tanggal))+'</div></div>'+
      '<div class="line">'+esc(r.hasil||'(tanpa catatan)')+'</div>'+
      '<div class="badges">'+
        badge(r.status||'?',stColor)+
        (r.ao?badge(r.ao,''):'')+
        (r.norek?badge(r.norek,'grey'):'')+
        (r.target?badge('🎯 '+fmtTgl(r.target),'amber'):'')+
      '</div>'+
      renderFotoStrip(extractFotos(r),false)+
      '</div>';
  });
  if(list.length>30) h+='<div class="dim">Ditampilkan 30 dulu dari '+list.length+'.</div>';
  return h;
}

function answerJanjiBayar(t){
  // Ambil laporan TERAKHIR per debitur; hanya yang status terakhirnya Janji Bayar
  const latest={};
  DB.mk.forEach(r=>{
    const k=String(r.norek||'').trim()||normNama(r.debitur||'');
    if(!k)return;
    const cur=latest[k];
    const a=(r.tanggal||'')+'|'+(r.createdAt||0);
    if(!cur||a>((cur.tanggal||'')+'|'+(cur.createdAt||0)))latest[k]=r;
  });
  const list=Object.values(latest).filter(r=>r.status==='Janji Bayar');
  const today=todayISO();
  list.sort((a,b)=>(a.target||'9999').localeCompare(b.target||'9999'));
  let h='<h3>Janji bayar aktif: <b>'+list.length+'</b></h3><div class="dim">Hanya yang laporan terakhirnya masih "Janji Bayar".</div><hr>';
  if(!list.length)return h+'<div class="dim">Tidak ada janji bayar yang masih menunggu.</div>';
  list.slice(0,20).forEach(r=>{
    const lewat=r.target&&r.target<today;
    h+='<div class="card" data-rek="'+esc(r.norek||'')+'" data-nama="'+esc(r.debitur||'')+'"><div class="top"><div class="name">'+esc(r.debitur)+'</div><div class="rek">'+esc(r.norek||'')+'</div></div>'+
      '<div class="line">'+esc(r.hasil||'-')+'</div><div class="badges">'+
      (r.target?badge((lewat?'🔴 Lewat ':'🎯 Target ')+fmtTgl(r.target),lewat?'red':'amber'):badge('Tanpa target','grey'))+
      badge('Dicatat '+fmtTgl(r.tanggal),'grey')+(r.ao?badge(r.ao,''):'')+'</div></div>';
  });
  if(list.length>20)h+='<div class="dim">Ditampilkan 20 dulu dari '+list.length+'.</div>';
  return h;
}

async function groqPost(key,model,msgs,reason){
  const body={model:model,messages:msgs,temperature:0,max_tokens:900};
  if(reason&&/gpt-oss/.test(model))body.reasoning_effort='low';
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);
  try{
    return await fetch(GROQ_URL,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
  }finally{clearTimeout(tm)}
}
async function pickModel(key,exclude){
  const res=await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':'Bearer '+key}});
  if(!res.ok)return null;
  const j=await res.json();
  const ids=(j.data||[]).map(m=>m.id).filter(id=>id&&id!==exclude&&!/whisper|orpheus|guard|safeguard|tts|embed|vision/i.test(id));
  const pref=[/gpt-oss-20b/,/gpt-oss-120b/,/llama-3\.3/,/llama-3\.1/,/qwen/,/llama/];
  for(const re of pref){const f=ids.find(id=>re.test(id));if(f)return f}
  return ids[0]||null;
}
async function llmRoute(text,key){
  const msgs=[{role:'system',content:llmSystemPrompt()}];
  HIST.slice(-4).forEach(h=>{msgs.push({role:'user',content:h.u});msgs.push({role:'assistant',content:h.j})});
  msgs.push({role:'user',content:text});
  let model=getModel(),reason=true,res=null,tried=0;
  while(tried<3){
    tried++;
    res=await groqPost(key,model,msgs,reason);
    if(res.ok)break;
    if(res.status===401)throw new Error('Kunci AI tidak valid (401)');
    if(res.status===429)throw new Error('Batas pemakaian AI tercapai (429)');
    if(res.status===400&&reason){reason=false;continue}
    if(res.status===404||res.status===400||res.status===403){
      const alt=await pickModel(key,model);
      if(alt&&alt!==model){model=alt;continue}
    }
    break;
  }
  if(!res||!res.ok){
    let det='';try{const e=await res.json();det=(e.error&&e.error.message)||''}catch(e){}
    throw new Error('AI error HTTP '+(res?res.status:'?')+(det?': '+det.slice(0,140):'')+' (model: '+model+')');
  }
  setModel(model);
  const data=await res.json();
  let c=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
  const i=c.indexOf('{'),k=c.lastIndexOf('}');
  if(i<0||k<i)throw new Error('AI tidak memberi jawaban yang bisa dibaca');
  const r=JSON.parse(c.slice(i,k+1));
  HIST.push({u:text,j:JSON.stringify(r)});if(HIST.length>6)HIST.shift();
  return r;
}
function routeToCommand(r){
  const n=r.nama?String(r.nama).trim():'';
  switch(r.intent){
    case'cari':return n?'cari '+n:null;
    case'riwayat':return n?'riwayat '+n:null;
    case'foto':return n?'foto '+n:'foto';
    case'angsuran':return n?'angsuran '+n:(r.belum?'yang belum angsur':'berapa nasabah sudah angsur');
    case'lunas':return n?'lunas '+n:'berapa yang lunas';
    case'coll':return r.coll!=null&&r.coll!==''?'coll '+parseInt(r.coll,10):(r.coll_tinggi?'coll tinggi':'sebaran coll');
    case'total':return'jumlah nasabah';
    case'statistik':return'rangkum data';
    case'tunggakan':return'tunggakan terbesar';
    case'janji':return'janji bayar';
    case'laporan':{
      const tgl=r.tanggal?String(r.tanggal).trim():'';
      const ao=r.ao?String(r.ao).trim():'';
      let cmd='laporan marketing';
      if(tgl) cmd+=' tanggal '+tgl;
      if(ao) cmd+=' '+ao;
      return cmd;
    }
    case'belum_dikunjungi':return'siapa yang belum dikunjungi';
    case'ao':return'rekap per AO '+(r.ao||'');
    case'diagnosa':return'diagnosa';
    case'bantuan':return'bantuan';
  }
  return null;
}
async function answerSmart(text){
  const key=getKey();
  if(!key)return buildAnswer(text);
  try{
    const r=await llmRoute(text,key);
    if(r.nama)lastNama=String(r.nama);
    if(r.intent==='ngobrol'&&r.balasan)return'<p>'+esc(r.balasan)+'</p>';
    const cmd=routeToCommand(r);
    if(!cmd)return buildAnswer(text);
    return buildAnswer(cmd);
  }catch(e){
    console.warn('AI',e);
    return note('AI tidak bisa dipakai ('+esc(e.message||e)+'). Memakai mode dasar.','warn')+buildAnswer(text);
  }
}

  const msg=cur
    ?(isShared
      ?'Kunci AI bersama sudah aktif (dari admin).\n\n• Tempel kunci baru → simpan sebagai kunci BERSAMA (semua HP pakai)\n• Ketik "LOKAL" lalu kunci → hanya HP ini\n• Kosongkan → hapus kunci bersama'
      :'Kunci AI lokal aktif di HP ini.\n\n• Tempel kunci baru → ganti kunci lokal\n• Ketik "BERSAMA" lalu kunci → simpan sebagai kunci bersama\n• Kosongkan → hapus kunci lokal')
    :'Tempel kunci API Groq (awalan gsk_).\n\nKunci akan disimpan sebagai kunci BERSAMA — semua pengguna aplikasi ini otomatis bisa pakai AI tanpa memasukkan sendiri.\n\n(Admin saja yang perlu mengisi sekali)';
  const v=prompt(msg,'');
  if(v===null)return;
  let raw=v.trim();
  let mode='shared'; // default: simpan sebagai bersama
  if(/^LOKAL\s+/i.test(raw)){mode='local';raw=raw.replace(/^LOKAL\s+/i,'').trim()}
  else if(/^BERSAMA\s+/i.test(raw)){mode='shared';raw=raw.replace(/^BERSAMA\s+/i,'').trim()}
  else if(cur && !isShared && !raw){mode='local'} // kosongkan lokal
  else if(isShared && !raw){mode='shared'}

  try{
    if(mode==='local'){
      setLocalKey(raw);
      updateStatus();
      addAiMsg(raw?note('🤖 Kunci AI lokal aktif di HP ini saja.','ok'):note('Kunci AI lokal dihapus.','warn'));
    }else{
      await setSharedKey(raw);
      setLocalKey(''); // hapus override lokal agar pakai bersama
      updateStatus();
      addAiMsg(raw
        ?note('🤖 Kunci AI BERSAMA berhasil disimpan. Semua pengguna sekarang bisa pakai mode AI tanpa memasukkan kunci sendiri.','ok')
        :note('Kunci AI bersama dihapus. Mode AI mati untuk semua pengguna (kecuali yang punya kunci lokal).','warn'));
    }
  }catch(e){
    addAiMsg(note('Gagal menyimpan kunci: '+esc(e.message||e),'bad'));
  }
});

/* ============ SUARA ============ */
let recog=null,recording=false;
const micBtn=$('#btnMic');
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBtn.style.display='none';return}
  recog=new SR();
  recog.lang='id-ID';recog.interimResults=false;recog.maxAlternatives=1;
  recog.onresult=ev=>{const txt=ev.results[0][0].transcript;inputEl.value=txt;ask(txt)};
  recog.onend=()=>{recording=false;micBtn.classList.remove('rec')};
  recog.onerror=()=>{recording=false;micBtn.classList.remove('rec')};
}
micBtn.addEventListener('click',()=>{
  if(!recog){alert('Perangkat tidak mendukung input suara.');return}
  if(recording){recog.stop();return}
  try{recog.start();recording=true;micBtn.classList.add('rec')}catch(e){recording=false;micBtn.classList.remove('rec')}
});

/* ============ MULAI ============ */
function greet(){
  const jam=new Date().getHours();
  const sap=jam<11?'Pagi':jam<15?'Siang':jam<18?'Sore':'Malam';
  addAiMsg('<h3>'+sap+'! 👋 Aku Tanya KOPENA</h3>'+
    '<p>Aku bisa cari data nasabah, lihat riwayat kunjungan, foto, dan status angsuran.</p>'+
    '<div class="dim">Contoh: <code>cari Surip</code> · <code>berapa nasabah sudah angsur?</code> · <code>sebaran Coll</code> · <code>berapa yang lunas?</code></div>');
}
renderChips();
greet();
listenBK();
listenMK();
listenAiKey();
fetchMaster();
initSpeech();
setInterval(updateStatus,5000);
setInterval(fetchMaster,5*60*1000);
