<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanya KOPENA</title>
<meta name="theme-color" content="#0f4d43">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f4d43'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'>T</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--brand:#0f4d43;--brand2:#1a6b5e;--soft:#e4ede9;--bg:#eef3f1;--surface:#fff;--line:#dbe5e1;--ink:#12201a;--muted:#69796f;--amber:#b5842a;--amber-soft:#fbf3e2;--red:#c0392b;--red-soft:#fbeae7;--green:#1f7a45;--green-soft:#e6f4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;font-size:15px;line-height:1.5;overscroll-behavior:none}
.nums{font-variant-numeric:tabular-nums}
.head{background:var(--brand);color:#f2f7f4;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(135deg,#1a6b5e,#0b3a33);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#c8f0e2;border:1px solid rgba(255,255,255,.18)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:800}
.brand p{margin:1px 0 0;font-size:11px;color:#a9cfc4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#eaf6f1;width:36px;height:36px;flex:0 0 36px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.25)}
.chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:100%;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{padding:10px 13px;border-radius:16px;max-width:88%;font-size:14.5px;word-break:break-word;overflow-wrap:anywhere}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(16,40,34,.04)}
.msg.user .bubble{background:var(--brand);color:#f0f8f5;border-bottom-right-radius:5px}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:2px}
.msg.user .avatar{display:none}
.bubble h3{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--brand)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0;padding-left:18px}.bubble li{margin-bottom:4px}
.bubble code{background:#eef3f1;padding:1px 5px;border-radius:5px;font-size:12.5px}
.bubble .dim{color:var(--muted);font-size:12.5px}
.bubble hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:8px 0;background:#fbfdfc;cursor:pointer}
.card:active{background:var(--soft)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-weight:700;font-size:14px}
.card .rek{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.card .line{font-size:12.5px;color:var(--muted);margin-top:3px}
.card .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--brand);white-space:nowrap}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.grey{background:#eef1ef;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
.tl{border-left:2px solid var(--soft);margin:8px 0 8px 5px;padding-left:12px}
.tl-item{position:relative;padding-bottom:11px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tl-date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tl-text{font-size:13.5px;margin-top:1px;white-space:pre-wrap}
.tl-meta{font-size:11px;color:var(--muted);margin-top:3px}
.tl-meta a{color:var(--brand2);text-decoration:none;font-weight:600}
.foto-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:#eef3f1}
.foto-thumb.big{width:88px;height:88px}
.photo-block{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.photo-block .pb-head{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b9c9c3;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--brand);cursor:pointer;white-space:nowrap}
.chip:active{background:var(--soft)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);position:sticky;bottom:0}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:#f7faf9;font:inherit;font-size:15px;color:var(--ink);outline:none}
.composer input:focus{border-color:var(--brand2);background:#fff}
.composer button{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
#btnMic{background:var(--soft);color:var(--brand)}
#btnMic.rec{background:#ffdad4;color:#c0392b;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.55}}
#btnSend{background:var(--brand);color:#fff}
#btnSend:disabled{opacity:.4}
.lightbox{position:fixed;inset:0;background:rgba(8,18,15,.94);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;flex-direction:column;gap:12px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:80vh;border-radius:10px}
.lightbox .lb-close{position:absolute;top:20px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.lightbox .lb-info{color:#a9cfc4;font-size:12.5px;text-align:center}
</style>
</head>
<body>

<header class="head">
  <div class="logo">TK</div>
  <div class="brand">
    <h1>Tanya KOPENA</h1>
    <p id="srcStatus">Menyambungkan…</p>
  </div>
  <button class="icon-btn" id="btnClearChat" title="Obrolan baru">🗑</button>
  <button class="icon-btn" id="btnReload" title="Muat ulang">⟳</button>
</header>

<main class="chat" id="chat"></main>
<div class="chips" id="chips"></div>

<form class="composer" id="composer">
  <button type="button" id="btnMic" title="Suara">🎤</button>
  <input id="q" placeholder="Tanya apa saja tentang nasabah…" autocomplete="off" enterkeyhint="send">
  <button type="submit" id="btnSend">➤</button>
</form>

<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()"></div>

<script>
/* ============================================================
   TANYA KOPENA v1.0 — CHAT ASISTEN
   Sumber:
   1. Master nasabah: SHEET_API_URL (sama dengan TungCab)
   2. Kunjungan & foto: Firebase catatanpembiayaan
   3. Laporan marketing: Firebase pembiayaankpnlimpung
   Catatan: field `sudah_angsur` diambil langsung dari server,
   TIDAK dihitung ulang.
   ============================================================ */

/* ============ KONFIG ============ */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzUTxsPIJR3Dp-GBQkQ1S2Afl7X3arqSAlUe_AZ3m7KDTnGNTmPgUsgABNa5vobH9mO/exec";
const SHEET_KEY = "12cc24460413dcf085c944540610c472df8d3c4441fca84d";

const CFG_BK = {apiKey:"AIzaSyBHFSeVEeuVr92MT2moc0FObzPxCGRiCoo",authDomain:"catatanpembiayaan.firebaseapp.com",databaseURL:"https://catatanpembiayaan-125fd-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"catatanpembiayaan",storageBucket:"catatanpembiayaan.firebasestorage.app",messagingSenderId:"840093282726",appId:"1:840093282726:web:307e1d9d5296cb2925df67"};
const CFG_MK = {apiKey:"AIzaSyAF6SwxLv6e1BpvOm_n1lMB1GnN5ZjSVnM",authDomain:"pembiayaankpnlimpung.firebaseapp.com",databaseURL:"https://pembiayaankpnlimpung-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pembiayaankpnlimpung",storageBucket:"pembiayaankpnlimpung.firebasestorage.app",messagingSenderId:"162750710548",appId:"1:162750710548:web:feee95cb39b9e7456ff801"};
const BK_ROOT = "buku-kunjungan-nasabah";
const INDEX_KEY = "nasabah-index-v2";
const DETAIL_KEY = "nasabah-detail-v2";

/* ============ UTIL ============ */
const $ = (s,r)=>(r||document).querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v===''||v==null)return 0;const n=Number(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function normNama(s){let t=String(s||'').toUpperCase();t=t.replace(/\b(H|HJ|HAJI|HAJAH|MUH|MOH|MOHAMMAD|MUHAMMAD|ABD|ABDUL|PAK|BU|BAPAK|IBU|SDR|SDRI)\b\.?\s+/g,' ');t=t.replace(/[^A-Z0-9 ]/g,' ');return t.replace(/\s+/g,' ').trim()}
function lev(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);return m[b.length][a.length]}
function fmtRp(v){const n=Math.round(num(v));if(Math.abs(n)>=1e9)return'Rp '+(n/1e9).toFixed(2)+' M';if(Math.abs(n)>=1e6)return'Rp '+(n/1e6).toFixed(2)+' jt';return'Rp '+n.toLocaleString('id-ID')}
function fmtRpFull(v){return'Rp '+Math.round(num(v)).toLocaleString('id-ID')}
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(iso){if(!iso)return'-';const s=String(iso).slice(0,10);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m){const m2=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);if(m2)return m2[1]+' '+BLN[parseInt(m2[2],10)-1]+' '+m2[3];return s}return parseInt(m[3],10)+' '+BLN[parseInt(m[2],10)-1]+' '+m[1]}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toArray(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);if(typeof v==='object')return Object.keys(v).sort((a,b)=>{const na=parseInt(a,10),nb=parseInt(b,10);if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a).localeCompare(String(b))}).map(k=>v[k]).filter(Boolean);return[]}
function extractFotos(v){if(!v)return[];const c=[v.photos,v.fotos,v.foto,v.photo,v.images,v.gambar];for(const x of c){const arr=toArray(x);const s=arr.filter(y=>typeof y==='string'&&y.length>20);if(s.length)return s}if(typeof v.photos==='string'&&v.photos.length>20)return[v.photos];if(typeof v.foto==='string'&&v.foto.length>20)return[v.foto];return[]}
function waLink(no,nama){if(!no)return null;let d=String(no).replace(/\D/g,'');if(!d)return null;if(d.startsWith('0'))d='62'+d.slice(1);else if(!d.startsWith('62'))d='62'+d;const t=nama?'Halo '+nama+', ':'';return'https://wa.me/'+d+'?text='+encodeURIComponent(t)}
function mapsUrl(a){if(!a)return null;let s=String(a).trim().replace(/\bDK\.?\s*/gi,'Dukuh ').replace(/\bDS\.?\s*/gi,'Desa ').replace(/\bKEC\.?\s*/gi,'Kecamatan ').replace(/\bRT\s*\/?\s*RW\.?\s*\d+\s*\/\s*\d*/gi,' ').replace(/\s+/g,' ').trim();if(!/batang/i.test(s))s+=', Batang, Jawa Tengah';return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s)}
function mapsCoord(lat,lng){return'https://www.google.com/maps/search/?api=1&query='+lat+','+lng}

/* ============ STATE ============ */
const DB = {master:[], bk:[], bkDetail:{}, mk:[], ready:{master:false,bk:false,mk:false}};

/* ============ FIREBASE ============ */
let bkDb=null, mkDb=null;
try{firebase.initializeApp(CFG_BK);bkDb=firebase.database()}catch(e){console.error(e)}
try{const a=firebase.initializeApp(CFG_MK,'kopena-mk');mkDb=a.database()}catch(e){console.error(e)}

function parseJsonSafe(v){if(v==null)return null;if(typeof v==='object')return v;try{return JSON.parse(v)}catch(e){return null}}

function listenBK(){
  if(!bkDb)return;
  bkDb.ref(BK_ROOT).on('value',snap=>{
    const val=snap.val()||{};
    const idx=parseJsonSafe(val[INDEX_KEY])||[];
    DB.bk=Array.isArray(idx)?idx.filter(n=>n&&!n.deletedAt):toArray(idx);
    const det=val[DETAIL_KEY]||{},out={};
    Object.keys(det).forEach(id=>{const d=parseJsonSafe(det[id]);if(d)out[id]=d});
    DB.bkDetail=out;
    DB.ready.bk=true;
    updateStatus();
  },err=>{console.warn('BK',err)});
}
function listenMK(){
  if(!mkDb)return;
  mkDb.ref('laporanMarketing').on('value',snap=>{
    const val=snap.val()||{};
    DB.mk=Object.entries(val).map(([k,r])=>Object.assign({},r,{_id:k}));
    DB.ready.mk=true;
    updateStatus();
  },err=>{console.warn('MK',err)});
}
async function fetchMaster(){
  try{
    const res=await fetch(SHEET_API_URL+'?key='+encodeURIComponent(SHEET_KEY),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    if(!Array.isArray(rows))throw new Error('Format salah');
    DB.master=rows;
    DB.ready.master=true;
    updateStatus();
  }catch(e){
    console.warn('Master error',e);
    DB.ready.master=false;
    updateStatus();
  }
}

function updateStatus(){
  const parts=[];
  parts.push(DB.ready.master?('🟢 Master ('+DB.master.length+')'):'🔴 Master');
  parts.push(DB.ready.bk?'🟢 Kunjungan':'🔴 Kunjungan');
  parts.push(DB.ready.mk?'🟢 Laporan':'🔴 Laporan');
  $('#srcStatus').textContent=parts.join(' · ');
}

/* ============ MATCHING ============ */
function scoreName(q,target){
  if(!q||!target)return 0;
  const a=norm(q),b=norm(target);
  if(!a||!b)return 0;
  if(b===a)return 100;
  if(b.startsWith(a))return 88;
  if(b.includes(a))return 74;
  const qt=a.split(' ').filter(w=>w.length>1);
  if(!qt.length)return 0;
  const bt=b.split(' ');
  let hit=0;
  qt.forEach(w=>{
    if(bt.some(t=>t===w))hit+=1;
    else if(bt.some(t=>t.startsWith(w)&&w.length>=3))hit+=0.75;
    else if(w.length>=4&&bt.some(t=>t.includes(w)))hit+=0.5;
  });
  const d=lev(a,b);
  if(d<=2&&Math.min(a.length,b.length)>=4)return 65+(2-d)*10;
  if(!hit)return 0;
  return 30+(hit/qt.length)*45;
}

function findMasterRecords(query,limit){
  const q=String(query||'').trim();
  if(!q)return[];
  const scored=[];
  DB.master.forEach(m=>{
    let s=scoreName(q,m.nama);
    const sRek=scoreName(q,m.no_rekening)*0.6;
    if(sRek>s)s=sRek;
    const sAl=scoreName(q,m.alamat)*0.4;
    if(sAl>s)s=sAl;
    if(s>=30)scored.push({m,s});
  });
  scored.sort((a,b)=>b.s-a.s);
  return scored.slice(0,limit||8).map(x=>x.m);
}

function findMasterByRek(rek){const r=String(rek||'').trim();if(!r)return null;return DB.master.find(m=>m.no_rekening===r)||null}

function findMasterByName(nama){
  if(!nama)return null;
  const key=normNama(nama);
  if(!key)return null;
  // exact dulu
  let hit=DB.master.find(m=>normNama(m.nama)===key);
  if(hit)return hit;
  // fuzzy
  let best=null,bestS=0;
  DB.master.forEach(m=>{
    const s=scoreName(nama,m.nama);
    if(s>bestS&&s>=55){bestS=s;best=m}
  });
  return best;
}

/* Ambil kunjungan + laporan dari Firebase untuk record tertentu (match by nama fuzzy) */
function getFirebaseTimeline(masterRec){
  if(!masterRec)return[];
  const nameKey=normNama(masterRec.nama);
  const rekKey=String(masterRec.no_rekening||'').trim();
  const out=[];
  // BK visits
  DB.bk.forEach(n=>{
    const rekP=String(n.rekPembiayaan||'').trim();
    const rekS=String(n.rekSimpanan||'').trim();
    const sameRek=(rekKey&&(rekP===rekKey||rekS===rekKey));
    const sameName=(nameKey&&normNama(n.nama)===nameKey);
    if(!sameRek&&!sameName)return;
    const det=DB.bkDetail[n.id];
    if(det){
      toArray(det.kunjungan).forEach(v=>{
        if(v&&!v.deletedAt){
          out.push({
            sumber:'buku', tanggal:v.tanggal||'', hasil:v.hasil||'',
            lokasi:v.location||null, fotos:extractFotos(v),
            ao:n.ao||'', status:''
          });
        }
      });
    }
  });
  // MK reports
  DB.mk.forEach(r=>{
    const sameRek=(rekKey&&String(r.norek||'').trim()===rekKey);
    const sameName=(nameKey&&normNama(r.debitur||'')===nameKey);
    if(!sameRek&&!sameName)return;
    out.push({
      sumber:'marketing', tanggal:r.tanggal||'', hasil:r.hasil||'',
      status:r.status||'', target:r.target||'', ao:r.ao||'',
      lokasi:r.lokasi||null, fotos:extractFotos(r),
      createdAt:r.createdAt||0
    });
  });
  out.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  return out;
}

/* ============ KARTU ============ */
function badge(t,c){return'<span class="badge '+(c||'')+'">'+esc(t)+'</span>'}
function renderFotoStrip(fotos,big){
  if(!fotos||!fotos.length)return'';
  const cls=big?'foto-thumb big':'foto-thumb';
  const arr=fotos.slice(0,6);
  const enc=encodeURIComponent(JSON.stringify(fotos));
  return'<div class="foto-strip">'+arr.map((f,i)=>
    '<img class="'+cls+'" src="'+f+'" loading="lazy" onclick="event.stopPropagation();openLightbox('+i+',\''+enc+'\')" alt="Foto">'

/* ============ INTENT DETECTION ============ */
function detectIntent(t){
  const s=' '+String(t).toLowerCase().replace(/[^\w\s\/:\-]/g,' ').replace(/\s+/g,' ')+' ';
  const clean=String(t).toLowerCase().trim().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
  const has=(...ws)=>ws.some(w=>s.includes(w));

  // Sapaan
  if(/^(halo+|hai+|hi+|hello+|hey+|hallo+|helo+)(\s+(semua|kamu|bot|admin|min))?$/i.test(clean))return'sapaan';
  if(/^(assalamualaikum|assalamu\s*alaikum|salam)/i.test(clean))return'sapaan';
  if(/^selamat\s+(pagi|siang|sore|malam)$/i.test(clean))return'sapaan';
  if(/^(pagi|siang|sore|malam|permisi|test|tes|min|admin|bot)$/i.test(clean))return'sapaan';
  if(/^(terima\s*kasih|makasih|mksh|thanks|thx|tq|syukron|alhamdulillah|oke|ok|sip|baik|mantap|keren|siap)$/i.test(clean))return'sapaan';
  if(/^(kamu|km|kamu\s+siapa|siapa\s+kamu)$/i.test(clean))return'sapaan';
  if(/^(bisa\s+apa\s+aja|bisa\s+apa|fitur|menu)$/i.test(clean))return'bantuan';
  if(/^(tolong|bantu|help)$/i.test(clean))return'bantuan';

  // Angsuran / sudah bayar
  if(/(sudah|udah).*(angsur|bayar|setor)/.test(s)||/berapa.*(angsur|sudah bayar)/.test(s))return'angsuran';
  if(/yang\s+sudah\s+angsur/.test(s)||/yang\s+belum\s+angsur/.test(s))return'angsuran';
  // Janji bayar
  if(has('janji bayar','janji','berjanji','sanggup bayar'))return'janji';
  // Belum dikunjungi
  if(has('belum dikunjungi','belum dikunjung','belum ada kunjungan','belum pernah'))return'belum';
  // Foto
  if(has('foto','photo','gambar','dokumentasi'))return'foto';
  // Riwayat
  if(has('riwayat','histori','kunjungan','kapan dikunjungi','hasil kunjungan','catatan'))return'riwayat';
  // Total
  if(/(total|jumlah|berapa).*(nasabah|rekening|anggota)/.test(s))return'total';
  // Statistik
  if(has('rangkum','statistik','ringkasan'))return'statistik';
  // Tunggakan
  if(has('tunggakan','outstanding','terbesar','piutang'))return'tunggakan';
  // Coll
  if(/\bcoll\s*[0-9]/i.test(s)||/coll\s+(berapa|tinggi)/.test(s))return'coll';
  return'cari';
}

/* ============ STOPWORDS & NAME EXTRACT ============ */
const STOP=new Set(['cari','carikan','data','info','nasabah','anggota','riwayat','kunjungan','siapa','apa','apakah','bagaimana','di','ke','dari','untuk','yang','dan','atau','tolong','tampilkan','lihat','berapa','kapan','saya','mau','ingin','tentang','detail','profil','semua','daftar','pak','bu','bapak','ibu','itu','ini','ada','dong','ya','saja','hari','tanggal','bulan','tahun','terakhir','dengan','punya','sudah','belum','pernah','dikunjungi','bayar','angsuran','janji','tunggakan','outstanding','saldo','foto','photo','gambar','halo','hai','hi','kamu','bisa','aja','rekening','nomor','alamat','dimana','mana','nya','punya','status','total','jumlah','berapa','tampilkan','tunjukkan']);
function extractName(text){
  let t=String(text).toLowerCase();
  t=t.replace(/\b(atas\s+nama|dengan\s+nama|namanya|nama|pak|bapak|bu|ibu|mas|mbak|saudara|sdr|sdri|untuk|dari)\s+/gi,' ');
  const toks=t.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const kept=toks.filter(x=>!STOP.has(x)&&x.length>1);
  return kept.join(' ').trim();
}

  let h='<h3>Belum pernah dikunjungi ('+list.length+')</h3><hr>';
  if(!list.length){
    h+='<div style="background:#e6f4ea;border:1px solid #c6e6d1;color:#1c6b3d;padding:10px 12px;border-radius:10px;margin:8px 0">🎉 Semua nasabah sudah pernah dicatat kunjungan!</div>';
    return h;
  }
  list.sort((a,b)=>num(b.saldo)-num(a.saldo));
  list.slice(0,15).forEach(m=>{h+=masterCard(m)});
  if(list.length>15)h+='<div class="dim">Masih ada '+(list.length-15)+' lagi.</div>';
  return h;
}

function answerJanjiBayar(t){
  const list=DB.mk.filter(r=>r.status==='Janji Bayar');
  const today=todayISO();
  list.sort((a,b)=>(a.target||'9999').localeCompare(b.target||'9999'));
  let h='<h3>Janji bayar ('+list.length+')</h3><hr>';
  if(!list.length){h+='<div class="dim">Belum ada catatan janji bayar.</div>';return h}
  list.slice(0,20).forEach(r=>{
    const lewat=r.target&&r.target<today;
    h+='<div class="card" data-rek="'+esc(r.norek||'')+'"><div class="top"><div class="name">'+esc(r.debitur)+'</div><div class="rek">'+esc(r.norek||'')+'</div></div>'+
      '<div class="line">'+esc(r.hasil||'-')+'</div>'+
      '<div class="badges">'+
      (r.target?badge((lewat?'🔴 Udah lewat ':'🎯 Target ')+fmtTgl(r.target),lewat?'red':'amber'):badge('Tanpa target','grey'))+
      badge('Dicatat '+fmtTgl(r.tanggal),'grey')+
      (r.ao?badge(r.ao,''):'')+
      '</div></div>';
  });
  if(list.length>20)h+='<div class="dim">Ditampilkan 20 dulu dari '+list.length+'.</div>';
  return h;
}

function answerTunggakan(){
  const list=DB.master.filter(m=>num(m.saldo)>0).sort((a,b)=>num(b.saldo)-num(a.saldo));
  const total=list.reduce((s,m)=>s+num(m.saldo),0);
  let h='<h3>Outstanding terbesar</h3><hr>';
  h+='<div style="background:#e6f4ea;border:1px solid #c6e6d1;color:#1c6b3d;padding:10px 12px;border-radius:10px;margin:8px 0">💰 Total outstanding: <b>'+fmtRpFull(total)+'</b></div>';
  list.slice(0,15).forEach(m=>{h+=masterCard(m)});
  if(list.length>15)h+='<div class="dim">Masih ada '+(list.length-15)+' lagi.</div>';
  return h;
}

function answerColl(t){
  const m=String(t).match(/coll\s*([0-9])/i);
  if(!m)return answerStatistik();
  const coll=parseInt(m[1],10);
  const list=DB.master.filter(x=>num(x.coll)===coll);
  const total=list.reduce((s,x)=>s+num(x.saldo),0);
  let h='<h3>Nasabah Coll '+coll+' ('+list.length+')</h3><hr>';
  if(!list.length){h+='<div class="dim">Tidak ada.</div>';return h}
  h+='<div class="dim">Total outstanding: <b>'+fmtRpFull(total)+'</b></div><hr>';
  list.sort((a,b)=>num(b.saldo)-num(a.saldo));
  list.slice(0,15).forEach(x=>{h+=masterCard(x)});
  if(list.length>15)h+='<div class="dim">Masih ada '+(list.length-15)+' lagi.</div>';
  return h;
}

/* ============ DISPATCHER ============ */
function buildAnswer(text){
  const intent=detectIntent(text);
  switch(intent){
    case 'sapaan':return answerSapaan(text);
    case 'bantuan':return answerBantuan();
    case 'total':return answerTotal();
    case 'statistik':return answerStatistik();
    case 'angsuran':return answerAngsuran(text);
    case 'janji':return answerJanjiBayar(text);
    case 'belum':return answerBelumDikunjungi(text);
    case 'foto':return answerFoto(text);
    case 'riwayat':return answerRiwayat(text);
    case 'tunggakan':return answerTunggakan();
    case 'coll':return answerColl(text);
    default:return answerCari(text);
  }
}

/* ============ UI CHAT ============ */
const chatEl=$('#chat'),inputEl=$('#q'),sendBtn=$('#btnSend'),chipsEl=$('#chips');
let busy=false;

function scrollBottom(){requestAnimationFrame(()=>{chatEl.scrollTop=chatEl.scrollHeight})}
function addUserMsg(t){const d=document.createElement('div');d.className='msg user';d.innerHTML='<div class="bubble">'+esc(t)+'</div>';chatEl.appendChild(d);scrollBottom()}
function addAiMsg(html){const d=document.createElement('div');d.className='msg ai';d.innerHTML='<div class="avatar">TK</div><div class="bubble">'+html+'</div>';chatEl.appendChild(d);scrollBottom();return d}
function addTyping(){const d=document.createElement('div');d.className='msg ai';d.id='typing';d.innerHTML='<div class="avatar">TK</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';chatEl.appendChild(d);scrollBottom()}
function removeTyping(){const t=$('#typing');if(t)t.remove()}

const CHIPS=['Berapa nasabah sudah angsur?','Siapa yang belum dikunjungi?','Ada yang janji bayar?','Tunggakan terbesar','Rangkum data kita'];

function renderChips(){
  chipsEl.innerHTML='';
  CHIPS.forEach(t=>{
    const b=document.createElement('button');
    b.type='button';b.className='chip';b.textContent=t;
    b.addEventListener('click',()=>{inputEl.value=t;ask(t)});
    chipsEl.appendChild(b);
  });
}

async function ask(text){
  text=String(text||'').trim();
  if(!text||busy)return;
  busy=true;sendBtn.disabled=true;inputEl.value='';
  addUserMsg(text);addTyping();

  // delay biar responsif
  await new Promise(r=>setTimeout(r,250));

  let html='';
  try{
    if(!DB.ready.master&&DB.master.length===0){
      html='<div style="background:#fbf3e2;border:1px solid #f0d888;color:#7a5c00;padding:10px 12px;border-radius:10px">Sedang memuat data dari server… Tunggu sebentar lalu tanya lagi.</div>';
    } else {
      html=buildAnswer(text);
    }
  }catch(e){
    console.error(e);
    html='<div style="background:#fbeae7;border:1px solid #f2c8c1;color:#9c3225;padding:10px 12px;border-radius:10px">Error: '+esc(e.message)+'</div>';
  }

  removeTyping();
  addAiMsg(html);
  busy=false;sendBtn.disabled=false;inputEl.focus();
}

/* ============ EVENT ============ */
chatEl.addEventListener('click',e=>{
  const card=e.target.closest('.card[data-rek]');
  if(card){
    const m=findMasterByRek(card.dataset.rek);
    if(m){addUserMsg('Detail '+m.nama);addAiMsg(masterDetail(m))}
  }
});

$('#composer').addEventListener('submit',e=>{e.preventDefault();ask(inputEl.value)});

$('#btnClearChat').addEventListener('click',()=>{
  if(!confirm('Mulai obrolan baru?'))return;
  chatEl.innerHTML='';greet();
});

$('#btnReload').addEventListener('click',()=>{
  addAiMsg('<div class="dim">Memuat ulang data…</div>');
  fetchMaster();listenBK();listenMK();
  setTimeout(()=>addAiMsg('<div style="background:#e6f4ea;border:1px solid #c6e6d1;color:#1c6b3d;padding:10px 12px;border-radius:10px">✓ Data dimuat ulang. '+DB.master.length+' rekening siap.</div>'),1200);
});

/* ============ VOICE ============ */
let recog=null,recording=false;
const micBtn=$('#btnMic');
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBtn.style.display='none';return}
  recog=new SR();
  recog.lang='id-ID';recog.interimResults=false;recog.maxAlternatives=1;
  recog.onresult=ev=>{const txt=ev.results[0][0].transcript;inputEl.value=txt;ask(txt)};
  recog.onend=()=>{recording=false;micBtn.classList.remove('rec')};
  recog.onerror=()=>{recording=false;micBtn.classList.remove('rec')};
}
micBtn.addEventListener('click',()=>{
  if(!recog){alert('Perangkat tidak mendukung input suara.');return}
  if(recording){recog.stop();return}
  try{recog.start();recording=true;micBtn.classList.add('rec')}catch(e){recording=false;micBtn.classList.remove('rec')}
});

/* ============ GREET & START ============ */
function greet(){
  const jam=new Date().getHours();
  const sap=jam<11?'Pagi':jam<15?'Siang':jam<18?'Sore':'Malam';
  addAiMsg('<h3>'+sap+'! 👋 Aku Tanya KOPENA</h3>'+
    '<p>Aku bisa cari data nasabah, lihat riwayat kunjungan, foto, dan status angsuran.</p>'+
    '<div class="dim">Contoh: <code>cari Surip</code> · <code>berapa nasabah sudah angsur?</code> · <code>siapa yang belum dikunjungi?</code> · <code>foto kunjungan Surip</code></div>');
}

renderChips();
greet();
listenBK();
listenMK();
fetchMaster();
initSpeech();
setInterval(updateStatus,5000);
setInterval(fetchMaster,5*60*1000); // refresh master tiap 5 menit
</script>
</body>
